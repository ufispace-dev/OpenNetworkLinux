# --- Slot Configuration ---
slots:
  layer1:
    normal_dir_type: "/slot"
    description:
      <<: *static_normal
      params: "Slots information"
    number:
      <<: *static_number
      params: "slots.layer1.layer2"
    layer2:
      one_param_dir_type: "/slot{}"
      1:
        description:
          <<: *static_normal
          params: "NA"
        model_name:
          <<: *static_normal
          params: "s9520-28xc"
        hardware_version:
          <<: *lpc_mb
          source: "board_hw_id"
        serial_number:
          <<: *static_normal
          params: "NA"
        part_number:
          <<: *static_normal
          params: "NA"
        status:
          <<: *static_normal
          params: "1"
        led_status:
          <<: *static_normal
          params: "1"
        num_temp_sensors:
          <<: *ref_rename
          source: "/sys_switch/temp_sensor/number"
        temp_sensor:
          <<: *ref_same
          source: "/sys_switch/temp_sensor/temp*"
        num_vol_sensors:
          <<: *ref_rename
          source: "/sys_switch/vol_sensor/number"
        vol_sensor:
          <<: *ref_same
          source: "/sys_switch/vol_sensor/vol*"
        num_curr_sensors:
          <<: *ref_rename
          source: "/sys_switch/curr_sensor/number"
        curr_sensor:
          <<: *ref_same
          source: "/sys_switch/curr_sensor/curr*"
        num_cplds:
          <<: *ref_rename
          source: "/sys_switch/cpld/number"
        cpld:
          <<: *ref_same
          source: "/sys_switch/cpld/cpld*"
        num_fpgas:
          <<: *ref_rename
          source: "/sys_switch/fpga/number"
        fpga:
          <<: *ref_same
          source: "/sys_switch/fpga/fpga*"
        model:
          <<: *lpc_mb
          source: "board_sku_id"
        design_phase:
          <<: *lpc_mb
          source: "board_deph_id"
        build_revision:
          <<: *lpc_mb
          source: "board_build_id"
        i2c_stuck:
          <<: *lpc_bsp
          source: "i2c_stuck"
        mux_reset_all:
          <<: *lpc_mb
          source: "mux_reset_all"
        reset_number:
          <<: *static_number
          params: "slots.layer1.layer2.1.layer3_1"
        num_extra_components:
          <<: *static_number
          params: "slots.layer1.layer2.1.layer3_2"
        layer3_1:
          one_param_dir_type: "/reset{}"
          1:
            description:
              <<: *static_normal
              params: "MUX reset"
            reset:
              <<: *lpc_mb
              source: "mux_reset_all"
        layer3_2:
          one_param_dir_type: "/extra_component{}"
          1:
            description:
              <<: *static_normal
              params: "EC"
            alias:
              <<: *static_normal
              params: "1"
            type:
              <<: *static_normal
              params: "ec"
            firmware_version:
              dev_type: "lpc_dev"
              dev_name: "ec"
              source: "ec_version_h"
        layer3_3:
          normal_dir_type: "/num_components"
          num_temp_sensors:
            <<: *static_number_component
            params: "temperature"
          num_fans:
            <<: *static_number_component
            params: "fan"
          num_psus:
            <<: *static_number_component
            params: "psu"
          num_leds:
            <<: *static_number_component
            params: "led"
          num_transceivers:
            <<: *static_number_component
            params: "sfp"

