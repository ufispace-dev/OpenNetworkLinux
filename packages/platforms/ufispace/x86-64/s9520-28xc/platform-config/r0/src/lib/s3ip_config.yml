# ==============================================================================
# YAML configuration for creating sysfs symbolic links for UfiSpace platforms.
# ==============================================================================

# Anchors for common device types and names
_anchors:
  static_normal: &static_normal
    dev_type: "static_link_dev"
    dev_name: "normal"
  static_number: &static_number
    dev_type: "static_link_dev"
    dev_name: "number"
  static_threshold: &static_threshold
    dev_type: "static_link_dev"
    dev_name: "threshold"
  static_to_attr: &static_to_attr
    dev_type: "static_link_dev"
    dev_name: "to_attr"
  static_number_component: &static_number_component
    dev_type: "static_link_dev"
    dev_name: "number_component"
  bmc_common: &bmc_common
    dev_type: "bmc_dev"
    dev_name: "bmc"
  i2c_cpld1: &i2c_cpld1
    dev_type: "i2c_dev"
    dev_name: "cpld1"
  i2c_cpld2: &i2c_cpld2
    dev_type: "i2c_dev"
    dev_name: "cpld2"
  i2c_cpld3: &i2c_cpld3
    dev_type: "i2c_dev"
    dev_name: "cpld3"
  i2c_cpld4: &i2c_cpld4
    dev_type: "i2c_dev"
    dev_name: "cpld4"
  i2c_cpld5: &i2c_cpld5
    dev_type: "i2c_dev"
    dev_name: "cpld5"
  i2c_eeprom: &i2c_eeprom
    dev_type: "i2c_dev"
    source: "eeprom"
  lpc_mb: &lpc_mb
    dev_type: "lpc_dev"
    dev_name: "mb_cpld"
  lpc_bsp: &lpc_bsp
    dev_type: "lpc_dev"
    dev_name: "bsp"
  lpc_cpu_cpld: &lpc_cpu_cpld
    dev_type: "lpc_dev"
    dev_name: "cpu_cpld"
  gpio_func: &gpio_func
    dev_type: "gpio_dev"
    dev_name: "gpio_function"
  ref_rename: &ref_rename
    dev_type: "ref_link_dev"
    dev_name: "rename"
  ref_same: &ref_same
    dev_type: "ref_link_dev"
    dev_name: "same_name"

# Base path for the custom sysfs structure
sys_switch_path: "/sys_switch"

# --- Temperature Sensor Configuration ---
temperature_sensors:
  # Path template for each sensor directory. {i} will be the 1-based index.
  layer1:
    normal_dir_type: "/temp_sensor"
    description:
      <<: *static_normal
      params: "Temperature information"
    number:
      <<: *static_number
      params: "temperature_sensors.layer1.layer2"
    layer2:
      one_param_dir_type: "/temp{}"
      1:
        description:
          <<: *static_normal
          params: "TEMP_MAC_ENV0"
        alias:
          <<: *static_normal
          params: "NA"
        type:
          <<: *static_normal
          params: "bmc"
        max:
          <<: *bmc_common
          source: "temp_mac_env0_max"
        min:
          <<: *bmc_common
          source: "temp_mac_env0_min"
        value:
          <<: *bmc_common
          source: "temp_mac_env0"
        max_warning_threshold:
          <<: *bmc_common
          source: "temp_mac_env0_upper_none_critical"
        max_error_threshold:
          <<: *bmc_common
          source: "temp_mac_env0_upper_critical"
        max_shutdown_threshold:
          <<: *bmc_common
          source: "temp_mac_env0_upper_none_recoverable"
      2:
        description:
          <<: *static_normal
          params: "TEMP_MAC_CORE"
