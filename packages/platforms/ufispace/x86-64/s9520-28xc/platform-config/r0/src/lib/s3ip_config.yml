# --- PSU Configuration ---
psus:
  layer1:
    normal_dir_type: "/psu"
    description:
      <<: *static_normal
      params: "PSU information"
    number:
      <<: *static_number
      params: "psus.layer1.layer2"
    layer2:
      one_param_dir_type: "/psu{}"
      1:
        description:
          <<: *static_normal
          params: "PSU 0"
        present:
          <<: *bmc_common
          source: "psu0_prsnt_l"
        out_status:
          <<: *bmc_common
          source: "psu0_pwrok_h"
        in_curr:
          <<: *bmc_common
          source: "psu0_iin"
        in_vol:
          <<: *bmc_common
          source: "psu0_vin"
        in_power:
          <<: *bmc_common
          source: "psu0_pin"
        out_curr:
          <<: *bmc_common
          source: "psu0_iout"
