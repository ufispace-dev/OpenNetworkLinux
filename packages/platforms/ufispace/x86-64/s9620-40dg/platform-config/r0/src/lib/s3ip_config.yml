# --- SYS LED Configuration ---
sys_leds:
  layer1:
    normal_dir_type: "/sysled"
    description:
      <<: *static_normal
      params: "System LED information"
    number:
      <<: *static_number
      params: "sys_leds.layer1.layer2"
    gnss_led_status:
      <<: *i2c_cpld1
      source: "cpld_system_led_gnss"
    sys_led_status:
      <<: *i2c_cpld1
      source: "cpld_system_led_sys"
    sync_led_status:
      <<: *i2c_cpld1
      source: "cpld_system_led_sync"
    fan_led_status:
      <<: *i2c_cpld1
      source: "cpld_system_led_fan"
    psu_led_status:
      <<: *i2c_cpld1
      source: "cpld_system_led_pwr"
    id_led_status:
      <<: *i2c_cpld1
      source: "cpld_system_led_id"
    layer2:
      one_param_dir_type: "/led{}"
      1:
        description:
          <<: *static_normal
          params: "Chassis LED 1 (GNSS LED)"
        status:
          <<: *i2c_cpld1
          source: "cpld_system_led_gnss"
        capability:
          <<: *static_normal
          params: "green,green_blink,yellow,yellow_blink"
        on_color:
          <<: *static_normal
          params: "green"
      2:
        description:
          <<: *static_normal
          params: "Chassis LED 2 (SYNC LED)"
        status:
          <<: *i2c_cpld1
          source: "cpld_system_led_sync"
        capability:
          <<: *static_normal
          params: "green,green_blink,yellow,yellow_blink"
        on_color:
          <<: *static_normal
          params: "green"
      3:
        description:
          <<: *static_normal
          params: "Chassis LED 3 (SYS LED)"
        status:
          <<: *i2c_cpld1
          source: "cpld_system_led_sys"
        capability:
          <<: *static_normal
          params: "green,green_blink,yellow,yellow_blink"
        on_color:
          <<: *static_normal
          params: "green"
      4:
        description:
          <<: *static_normal
          params: "Chassis LED 4 (FAN LED)"
        status:
          <<: *i2c_cpld1
          source: "cpld_system_led_fan"
        capability:
          <<: *static_normal
          params: "green,green_blink,yellow,yellow_blink"
        on_color:
          <<: *static_normal
          params: "NA"
      5:
        description:
          <<: *static_normal
          params: "Chassis LED 5 (PSU LED)"
        status:
          <<: *i2c_cpld1
          source: "cpld_system_led_pwr"
        capability:
          <<: *static_normal
          params: "green,green_blink,yellow,yellow_blink"
        on_color:
          <<: *static_normal
          params: "NA"
      6:
        description:
          <<: *static_normal
          params: "Chassis LED 6 (ID LED)"
        status:
          <<: *i2c_cpld1
          source: "cpld_system_led_id"
        capability:
          <<: *static_normal
          params: "blue,blue_blink"
        on_color:
          <<: *static_normal
          params: "blue"

