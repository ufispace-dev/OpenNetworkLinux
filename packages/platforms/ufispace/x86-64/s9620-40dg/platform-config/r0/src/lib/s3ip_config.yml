# --- PSU Configuration ---
psus:
  layer1:
    normal_dir_type: "/psu"
    description:
      <<: *static_normal
      params: "PSU information"
    number:
      <<: *static_number
      params: "psus.layer1.layer2"
    layer2:
      one_param_dir_type: "/psu{}"
      1:
        description:
          <<: *static_normal
          params: "PSU 0"
        present:
          <<: *bmc_common
          source: "psu0_prsnt_l"
        out_status:
          <<: *bmc_common
          source: "psu0_pwrok_h"
        in_curr:
          <<: *bmc_common
          source: "psu0_iin"
        in_vol:
          <<: *bmc_common
          source: "psu0_vin"
        in_power:
          <<: *bmc_common
          source: "psu0_pin"
        out_curr:
          <<: *bmc_common
          source: "psu0_iout"
        out_vol:
          <<: *bmc_common
          source: "psu0_vout"
        out_power:
          <<: *bmc_common
          source: "psu0_pout"
        stbout_curr:
          <<: *static_normal
          params: "NA"
        stbout_vol:
          <<: *static_normal
          params: "NA"
        manufacturer:
          <<: *bmc_common
          source: "psu0_fru_mf"
        model_name:
          <<: *bmc_common
          source: "psu0_fru_pn"
        product_name:
          <<: *bmc_common
          source: "psu0_fru_pname"
        part_number:
          <<: *bmc_common
          source: "psu0_fru_pn"
        serial_number:
          <<: *bmc_common
          source: "psu0_fru_sn"
        fan_speed:
          <<: *bmc_common
          source: "psu0_fan1"
        fan_speed_ac_max:
          <<: *static_normal
          params: "26500"
        fan_speed_dc_max:
          <<: *static_normal
          params: "29000"
        hardware_version:
          <<: *static_normal
          params: "NA"
        type:
          <<: *bmc_common
          source: "psu0_type"
        in_status:
          <<: *static_normal
          params: "NA"
        fan_direction:
          <<: *bmc_common
          source: "psu0_fan_dir"
        led_status:
          <<: *static_normal
          params: "NA"
        out_max_power:
          <<: *static_normal
          params: "1300000000"
        num_temp_sensors:
          <<: *static_number
          params: "psus.layer1.layer2.1.layer3"
        layer3:
          one_param_dir_type: "/temp{}"
          1:
            description:
              <<: *static_normal
              params: "PSU 0 THERMAL 1"
            value:
              <<: *bmc_common
              source: "psu0_temp1"
